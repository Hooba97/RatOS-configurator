# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.
# AWD (All-Wheel Drive) TMC5160 configuration for the 4 CoreXY motors.
# Uses TMC5160 drivers at 48V for the LDO-42STH60-3004AH Kraken motors.

[tmc5160 stepper_x]
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper_x1]
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper_y]
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper_y1]
stealthchop_threshold: 0
interpolate: False

# NOTE: Extruder TMC is configured by the toolboard (BTT EBB SB2209 v2.0 RP2040).

[tmc2209 stepper_z]
stealthchop_threshold: 1

[tmc2209 stepper_z1]
stealthchop_threshold: 1

[tmc2209 stepper_z2]
stealthchop_threshold: 1

[tmc2209 stepper_z3]
stealthchop_threshold: 1
