# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.
#
# AWD (All-Wheel Drive) Voron V2.4 - 4-motor CoreXY configuration.
# X  = A motor front-left
# X1 = A motor rear-left (second A belt)
# Y  = B motor front-right
# Y1 = B motor rear-right (second B belt)
# Z, Z1, Z2, Z3 = four Z motors for quad gantry leveling

[stepper_x]
step_pin: x_step_pin
dir_pin: x_dir_pin
enable_pin: !x_enable_pin
rotation_distance: 40
microsteps: 64
homing_speed: 50
homing_retract_dist: 5

[stepper_x1]
step_pin: x1_step_pin
dir_pin: x1_dir_pin
enable_pin: !x1_enable_pin
rotation_distance: 40
microsteps: 64

[stepper_y]
step_pin: y_step_pin
dir_pin: y_dir_pin
enable_pin: !y_enable_pin
rotation_distance: 40
microsteps: 64
homing_speed: 50
homing_retract_dist: 5

[stepper_y1]
step_pin: y1_step_pin
dir_pin: y1_dir_pin
enable_pin: !y1_enable_pin
rotation_distance: 40
microsteps: 64

[stepper_z]
endstop_pin: probe:z_virtual_endstop
step_pin: z0_step_pin
dir_pin: !z0_dir_pin
enable_pin: !z0_enable_pin
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
position_min: -5 # Needed for z-offset calibration and tilt_adjust.
homing_speed: 10

[stepper_z1]
step_pin: z1_step_pin
dir_pin: z1_dir_pin
enable_pin: !z1_enable_pin
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[stepper_z2]
step_pin: z2_step_pin
dir_pin: !z2_dir_pin
enable_pin: !z2_enable_pin
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[stepper_z3]
step_pin: z3_step_pin
dir_pin: z3_dir_pin
enable_pin: !z3_enable_pin
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

# NOTE: The extruder stepper is driven by the toolboard (BTT EBB SB2209 v2.0 RP2040).
# Its step/dir/enable pins and TMC driver are defined in the toolboard configuration.
