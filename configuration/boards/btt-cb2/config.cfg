# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, copy and paste relevant sections
# into your printer.cfg and change it there.

[include board.cfg]

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor BTT_CB2]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[adxl345]
spi_software_sclk_pin: adxl345_sclk_pin
spi_software_mosi_pin: adxl345_mosi_pin
spi_software_miso_pin: adxl345_miso_pin
cs_pin: adxl345_cs_pin
