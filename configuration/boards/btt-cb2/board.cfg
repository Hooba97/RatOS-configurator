# BTT CB2 (Rockchip RK3566) Pin Aliases for RatOS
# Pin mapping formulas calculated from RK3566 registers: (Group - 'A') * 8 + Pin

[board_pins btt_cb2]
mcu: rpi
aliases:
  # SPI1 Pins (Physical Pins 19, 21, 23, 24)
  adxl345_cs_pin=gpiochip4/gpio2,
  adxl345_sclk_pin=gpiochip3/gpio19,
  adxl345_mosi_pin=gpiochip3/gpio20,
  adxl345_miso_pin=gpiochip3/gpio18,

  # UART2 Pins (Physical Pins 8, 10)
  uart_tx_pin=gpiochip0/gpio25,
  uart_rx_pin=gpiochip0/gpio24,

  # 40-pin GPIO Header Mapping
  gpio_pin3=gpiochip4/gpio10,
  gpio_pin5=gpiochip4/gpio11,
  gpio_pin7=gpiochip3/gpio1,
  gpio_pin11=gpiochip0/gpio23,
  gpio_pin12=gpiochip0/gpio8,
  gpio_pin13=gpiochip1/gpio0,
  gpio_pin15=gpiochip1/gpio1,
  gpio_pin16=gpiochip4/gpio22,
  gpio_pin18=gpiochip3/gpio17,
  gpio_pin22=gpiochip0/gpio20,
  gpio_pin26=gpiochip0/gpio6,
  gpio_pin28=gpiochip0/gpio11,
  gpio_pin29=gpiochip3/gpio30,
  gpio_pin31=gpiochip0/gpio16,
  gpio_pin32=gpiochip0/gpio17,
  gpio_pin33=gpiochip3/gpio31,
  gpio_pin35=gpiochip4/gpio21,
  gpio_pin36=gpiochip0/gpio19,
  gpio_pin37=gpiochip3/gpio2,
  gpio_pin38=gpiochip4/gpio19,
  gpio_pin40=gpiochip4/gpio18
