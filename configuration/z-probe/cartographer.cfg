# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

# Configurator Metadata
# {
#   "type": "static-probe",
#   "title": "Cartographer3D v3"
# }

#####
# CARTOGRAPHER3D v3 - USB SCANNER PROBE
# https://docs.cartographer3d.com/
#
# The Cartographer probe uses a separate MCU connected over USB.
# IMPORTANT: You must find your USB serial path first:
#   ls /dev/serial/by-id/
# Then set the serial value in the [mcu cartographer] section below.
# It will look like:
#   /dev/serial/by-id/usb-cartographer_cartographer_XXXXXXXXXXXX-if00
#####

[mcu cartographer]
serial: /dev/serial/by-id/usb-cartographer_cartographer_<your_serial_id>-if00
restart_method: command

#####
# CARTOGRAPHER SCANNER MODULE
# Calibration docs: https://docs.cartographer3d.com/cartographer-probe/installation-and-setup
#####
[cartographer]
mcu: cartographer
# Offsets are measured from the centre of the coil to the tip of the nozzle.
# Measure and adjust these to your specific installation.
x_offset: 0.0   # Adjust for your mount
y_offset: 21.1  # Adjust for your mount (SB2209 + CW2 is approx 21.1mm)
backlash_comp: 0.5

# Scanner speed and mesh settings
speed: 10.
lift_speed: 80.
mesh_main_direction: x
mesh_cluster_size: 1
mesh_runs: 1

# Contact mode settings (used for True Z calibration)
scanner_touch_speed: 3
scanner_touch_z_offset: 0.05

[bed_mesh]
mesh_min: 30,30
log_points: False

[gcode_macro RatOS]
variable_z_probe: "static"

#####
# RESONANCE TESTING VIA CARTOGRAPHER BUILT-IN ADXL345
# The Cartographer3D v3 has an integrated ADXL345 accelerometer.
# CS pin is cartographer:PA0 per the v3 specification.
#####
[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    175,175,20  # Override in printer.cfg to be the centre of your bed.
